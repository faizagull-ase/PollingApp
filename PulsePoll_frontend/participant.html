<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulsePoll — Join</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #e4e9ef;
    --text: #1b2430;
    --text-dim: #5b6472;
    --accent: #2f6f6b;
    --accent-soft: #dcece9;
    --border: #d7dce2;
    --danger: #b3261e;
    --danger-soft: #f8e3e1;
    --success: #1e7d4a;
    --success-soft: #e0f0e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, sans-serif;
    line-height: 1.5;
    padding: 24px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--text-dim); margin-bottom: 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: .85rem; color: var(--text-dim); margin-bottom: 4px; }
  input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 1.1rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: .95rem;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 1rem;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .option-btn.selected { background: var(--accent-soft); border-color: var(--accent); }
  .option-btn.rejected { background: var(--danger-soft); border-color: var(--danger); }
  .msg { font-size: .9rem; margin-top: 10px; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }
  .hidden { display: none !important; }
  .question-count { font-size: .8rem; color: var(--text-dim); margin-bottom: 6px; }
  .closed-banner {
    background: var(--danger-soft);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>PulsePoll</h1>
  <p class="sub">Enter the poll code your operator shared.</p>

  <div class="card" id="join-card">
    <label>Poll code</label>
    <input type="text" id="code-input" placeholder="e.g. 7F3KQ" maxlength="6">
    <button type="button" id="join-btn">Join poll</button>
    <div class="msg error hidden" id="join-error"></div>
  </div>

  <div class="card hidden" id="question-card">
    <div class="question-count" id="question-count"></div>
    <h2 id="question-text"></h2>
    <div id="options-container"></div>
    <div class="msg hidden" id="answer-msg"></div>
  </div>

  <div class="card hidden" id="closed-card">
    <div class="closed-banner">This poll has closed.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
<script>
const API_BASE = "http://localhost:5058";
const HUB_URL = API_BASE + "/hubs/poll";

let connection = null;
let pollCode = null;
let currentQuestionIndex = -1;
let answeredQuestions = new Set();

const joinCard = document.getElementById("join-card");
const questionCard = document.getElementById("question-card");
const closedCard = document.getElementById("closed-card");
const joinError = document.getElementById("join-error");
const answerMsg = document.getElementById("answer-msg");

function showMsg(el, text, kind) {
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
  el.classList.remove("hidden");
}

document.getElementById("join-btn").addEventListener("click", async () => {
  const code = document.getElementById("code-input").value.trim();
  if (!code) {
    showMsg(joinError, "Enter a poll code.", "error");
    return;
  }
  joinError.classList.add("hidden");
  await joinPoll(code);
});

async function joinPoll(code) {
  pollCode = code.toUpperCase();

  try {
    if (!connection) {
      connection = new signalR.HubConnectionBuilder()
        .withUrl(HUB_URL)
        .withAutomaticReconnect()
        .build();

      connection.on("QuestionChanged", payload => onQuestionChanged(payload));
      connection.on("PollClosed", () => onPollClosed());

      connection.onreconnected(async () => {
        try {
          await connection.invoke("JoinPoll", pollCode);
          const snapshot = await connection.invoke("GetPollSnapshot", pollCode);
          applySnapshot(snapshot);
        } catch {
          onPollClosed();
        }
      });

      await connection.start();
    }

    const result = await connection.invoke("JoinPoll", pollCode);
    if (result.reason) {
      if (result.reason === "poll_closed") {
        onPollClosed();
      } else {
        showMsg(joinError, `Could not join: ${result.reason}`, "error");
      }
      return;
    }

    applySnapshot(result);
    joinCard.classList.add("hidden");
    questionCard.classList.remove("hidden");
  } catch (err) {
    showMsg(joinError, err.message, "error");
  }
}

function applySnapshot(snapshot) {
  answeredQuestions.clear();
  renderQuestion(snapshot.question, snapshot.options, snapshot.questionIndex, snapshot.questionCount);
}

function onQuestionChanged(payload) {
  renderQuestion(payload.question, payload.options, payload.questionIndex, payload.questionCount);
}

function renderQuestion(text, options, questionIndex, questionCount) {
  currentQuestionIndex = questionIndex;
  document.getElementById("question-count").textContent = `Question ${questionIndex + 1} of ${questionCount}`;
  document.getElementById("question-text").textContent = text;
  answerMsg.classList.add("hidden");

  const container = document.getElementById("options-container");
  container.innerHTML = "";
  const alreadyAnswered = answeredQuestions.has(questionIndex);

  options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.disabled = alreadyAnswered;
    btn.addEventListener("click", () => submitAnswer(questionIndex, i, btn, container));
    container.appendChild(btn);
  });

  questionCard.classList.remove("hidden");
  closedCard.classList.add("hidden");
}

async function submitAnswer(questionIndex, optionIndex, btn, container) {
  [...container.children].forEach(b => b.disabled = true);
  btn.classList.add("selected");

  try {
    const result = await connection.invoke("SubmitAnswer", pollCode, questionIndex, optionIndex);
    if (result.reason) {
      btn.classList.remove("selected");
      btn.classList.add("rejected");
      showMsg(answerMsg, `Not counted: ${result.reason}`, "error");
      if (result.reason !== "duplicate" && result.reason !== "stale_question") {
        [...container.children].forEach(b => b.disabled = false);
        btn.classList.remove("rejected");
      }
    } else {
      answeredQuestions.add(questionIndex);
      showMsg(answerMsg, "Answer submitted.", "success");
    }
  } catch (err) {
    showMsg(answerMsg, err.message, "error");
  }
}

function onPollClosed() {
  questionCard.classList.add("hidden");
  joinCard.classList.add("hidden");
  closedCard.classList.remove("hidden");
}
</script>
</body>
</html>
